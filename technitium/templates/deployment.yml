# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: {{ .Release.Namespace }}
  labels:
    app: technitium
spec:
  selector:
    matchLabels:
      app: technitium
  replicas: 1
  template:
    metadata:
      labels:
        app: technitium
    spec:
      containers:
      - name: technitium
        image: {{ .Values.image }}
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 853
          protocol: TCP
          name: dns-tls-tcp
        - containerPort: 853
          protocol: UDP
          name: dns-tls-udp
        - containerPort: 443
          protocol: UDP
          name: dns-https-udp
        - containerPort: 443
          protocol: TCP
          name: dns-https-tcp
        - containerPort: 80
          protocol: TCP
          name: dns-http
        - containerPort: 8053
          protocol: TCP
          name: dns-http-proxy
        - containerPort: 5380
          protocol: TCP
          name: web
        - containerPort: 53443
          protocol: TCP
          name: api
        - containerPort: 67
          protocol: UDP
          name: dhcp
        volumeMounts:
        - name: config
          mountPath: /etc/dns
        - name: logs
          mountPath: /var/log/technitium/dns
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: technitium-config-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: technitium-logs-pvc
      restartPolicy: Always
---

