apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: technitium-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: http-gateway
      namespace: default
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - technitium.jarvis-home.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: technitium-svc
          port: 5380
