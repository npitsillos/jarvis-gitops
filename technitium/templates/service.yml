apiVersion: v1
kind: Service
metadata:
  labels:
    app: technitium
  name: technitium-svc
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 5380
      protocol: TCP
      targetPort: web
  selector:
    app: technitium
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: technitium
  name: technitium-dns
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  externalIPs:
    - 192.168.10.100
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
  selector:
    app: technitium
